<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      
      .corp-title { font-family: 'Arial Black', 'Impact', 'Helvetica Neue', sans-serif; }
      .corp-sub { font-family: 'Courier Prime', 'Courier New', monospace; }
    </style>
    
    <!-- Technisches Hintergrund-Raster -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#12161f" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Dunkler Void-Hintergrund -->
  <rect width="600" height="600" fill="#08090c" />

  <!-- Inneres Raster im Kreis -->
  <circle cx="300" cy="300" r="280" fill="url(#grid)" />

  <!-- Massive, äußere Corporate-Ringe -->
  <circle cx="300" cy="300" r="280" fill="none" stroke="#2d3748" stroke-width="2" />
  <circle cx="300" cy="300" r="265" fill="none" stroke="#e2e8f0" stroke-width="12" />
  <circle cx="300" cy="300" r="250" fill="none" stroke="#ff3f00" stroke-width="3" />
  <circle cx="300" cy="300" r="244" fill="none" stroke="#2d3748" stroke-width="1" />

  <!-- Fadenkreuze / Asset-Markierungen an den Rändern
  <path d="M 300,10 L 300,45 M 300,555 L 300,590 M 10,300 L 45,300 M 555,300 L 590,300" fill="none" stroke="#ff3f00" stroke-width="4" />
  <path d="M 300,20 L 300,35 M 300,565 L 300,580 M 20,300 L 35,300 M 565,300 L 580,300" fill="none" stroke="#ffffff" stroke-width="4" />
  -->
  <!-- Kleine technische Spezifikationen -->
  <text x="300" y="100" text-anchor="middle" class="corp-sub" font-size="10" fill="#4a5568" letter-spacing="4">ALL | BUT | NORMAL</text>
  <text x="300" y="480" text-anchor="middle" class="corp-sub" font-size="10" fill="#4a5568" letter-spacing="4"> // BUILDING TOMORROW TODAY \\</text>

  <!-- Zentrales Monogramm (Ineinandergreifende Ligatur) -->
  <!-- Der dicke Stroke in Hintergrundfarbe erzeugt einen perfekten, 8px breiten Stencil-Cut zwischen den Buchstaben -->
  <g stroke="#08090c" stroke-width="8" stroke-linejoin="miter">
    
    <!-- Das "U" (Titanium Grey) - Bildet den unteren Teil des geteilten Pfeilers -->
    <path d="M 165,130 L 215,130 L 215,280 L 265,280 L 265,230 L 315,230 L 315,330 L 165,330 Z" fill="#e2e8f0" />
    
    <!-- Das "N" (Hazard Orange) - Bildet den oberen Teil des geteilten Pfeilers und schließt nahtlos an -->
    <path d="M 265,130 L 315,130 L 385,246.7 L 385,130 L 435,130 L 435,330 L 385,330 L 315,213.3 L 315,230 L 265,230 Z" fill="#ff3f00" />
    
  </g>

  <!-- Haupt-Typografie -->
  <text x="300" y="415" text-anchor="middle" class="corp-title" font-weight="900" font-size="46" fill="#e2e8f0" letter-spacing="12">UNNORMAL</text>
  
  <!-- Subline eingefasst in technische Linien -->
  <g transform="translate(0, 455)">
    <line x1="160" y1="-5" x2="240" y2="-5" stroke="#2d3748" stroke-width="3" />
    <text x="303" y="0" text-anchor="middle" class="corp-sub" font-weight="bold" font-size="18" fill="#ff3f00" letter-spacing="10">GMBH</text>
    <line x1="360" y1="-5" x2="440" y2="-5" stroke="#2d3748" stroke-width="3" />
  </g>
</svg>