<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNNORMAL GMBH</title>
  <link rel="icon" type="image/svg+xml" href="./unnormal.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="corner corner-tl" aria-hidden="true"></div>
  <div class="corner corner-tr" aria-hidden="true"></div>
  <div class="corner corner-bl" aria-hidden="true"></div>
  <div class="corner corner-br" aria-hidden="true"></div>

  <div class="hud-frame">
    <header class="hud-bar" aria-hidden="true">
      <div class="hud-group">
        <span class="status-dot"></span>
        <span>SYS.ONLINE <span class="hud-hide-mobile">// SEC-01</span></span>
      </div>
      <div class="hud-group">
        <span class="hud-accent">UNNORMAL GMBH</span>
      </div>
    </header>

    <main class="core-stage">
      <div class="logo-container">
        <img
          src="./unnormal.svg"
          alt="UNNORMAL GMBH Logo"
          class="corp-logo"
        />
      </div>

      <div class="statement-wrapper">
        <h1 class="main-text">And the day came when the risk to remain tight in a bud was more painful than the risk it took to blossom</h1>
        <p>Elizabeth Appell</p>
        <div class="hazard-divider" aria-hidden="true"></div>
      </div>
    </main>

    <dialog id="impressum" popover>
      <h2>Impressum</h2>
      <p>UNNORMAL GMBH</p>
      <p>Roosstr. 42d, 8105 Regensdorf</p>
      <p>waslos@unnormal.ch</p>
    </dialog>

    <footer class="hud-bar" aria-hidden="true">
      <div class="hud-group">
        <span>ALL | BUT | NORMAL</span>
      </div>
      <button popovertarget="impressum" class="hud-group">
        <span>IMPRESSUM</span>
      </button>
      <div class="hud-group">
        <span class="hud-hazard">■</span>
        <span>CORP.NODE // ACTIVE</span>
      </div>
    </footer>
  </div>
</body>
</html>
